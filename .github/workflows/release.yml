name: release-on-production

on:
  push:
    branches: [ "production" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      THEME_SLUG: ${{ github.repository_owner != '' && github.repository != '' && github.repository }} # Platzhalter; wird unten überschrieben
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Theme-Slug aus Repo-Namen ermitteln
        id: slug
        run: |
          SLUG="${GITHUB_REPOSITORY##*/}"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "THEME_SLUG=$SLUG" >> "$GITHUB_ENV"

      - name: Version aus style.css lesen
        id: v
        shell: bash
        run: |
          FILE="style.css"
          # Falls das Theme in einem Unterordner liegt, einen passenden style.css suchen
          if [ ! -f "$FILE" ]; then
            FILE="$(find . -maxdepth 2 -iname style.css | head -n1)"
          fi
          if [ -z "$FILE" ]; then
            echo "Kein style.css gefunden"; exit 1;
          fi
          VER=$(grep -iE '^[[:space:]]*Version:[[:space:]]*' "$FILE" | head -1 | sed -E 's/^[[:space:]]*[Vv]ersion:[[:space:]]*//; s/[[:space:]]+$//')
          if [ -z "$VER" ]; then
            echo "Keine Version in style.css gefunden"; exit 1;
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Version: $VER"

      - name: Git user (für Tag-Push)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Tag erstellen falls neu
        run: |
          TAG="v${{ steps.v.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG existiert bereits – wir benutzen ihn."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: ZIP bauen (Root → Ordner = THEME_SLUG → ZIP)
        run: |
          set -e
          mkdir -p dist "${{ steps.slug.outputs.slug }}"
          rsync -a ./ "${{ steps.slug.outputs.slug }}"/ \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude "node_modules/" \
            --exclude "vendor/bin/" \
            --exclude "dist/" \
            --exclude "*.map" \
            --exclude ".DS_Store" \
            --exclude ".gitignore" \
            --exclude ".gitattributes" \
            --exclude "*.md" \
            --exclude "README" \
            --exclude "README.*"

          # sicherstellen, dass die Version im Build-Style.css identisch ist
          if [ -f "${{ steps.slug.outputs.slug }}/style.css" ]; then
            if grep -qi "^Version:" "${{ steps.slug.outputs.slug }}/style.css"; then
              sed -i "s/^Version:.*$/Version: ${{ steps.v.outputs.version }}/I" "${{ steps.slug.outputs.slug }}/style.css"
            fi
          fi

          # ZIP enthält den Ordner $THEME_SLUG als Top-Level – Dateiname OHNE Versionsnummer (wie beim Plugin)
          zip -r "dist/${{ steps.slug.outputs.slug }}.zip" "${{ steps.slug.outputs.slug }}"

      - name: Release erstellen/aktualisieren
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: v${{ steps.v.outputs.version }}   # Release-Name identisch zum Plugin
          files: dist/${{ steps.slug.outputs.slug }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
